[project]
name        = "dotfiles"
description = "Sensible system dotfiles"
classifiers = ["Private :: Do Not Upload"]
version     = "1.0"
license     = "MIT"
dependencies = [
    "attrs",
    "cyclopts",
    "pydantic",
]

[project.scripts]
dot      = "dotfiles.__main__:main"
get-yay  = "dotfiles.pacman:Yay.get"
dot-stow = "dotfiles.stow:main"
sandbox  = "dotfiles.scripts.sandbox:main"
ituna    = "dotfiles.scripts.ituna:main"
pacsync  = "dotfiles.pacman:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
