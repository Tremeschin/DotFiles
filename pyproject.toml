[project]
name        = "dotfiles"
description = "Sensible system dotfiles"
classifiers = ["Private :: Do Not Upload"]
version     = "1.0"
license     = "MIT"
dependencies = [
    "attrs",
    "cyclopts",
    "parsenaut",
    "pydantic",
]

[project.scripts]
dot = "dotfiles.__main__:main"
dot-stow = "dotfiles.stow.__init__:main"
sandbox = "dotfiles.scripts.sandbox:main"
ituna   = "dotfiles.scripts.ituna:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
